[project]
name = "antfly-langchain-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langchain-antfly", "langgraph-store-antfly"]
[tool.uv.workspace]
members = ["packages/*"]
[tool.uv.sources]
langchain-antfly = { workspace = true }
langgraph-store-antfly = { workspace = true }
[dependency-groups]
interoperability = ["langchain-openai>=1,<2"]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.13", "langchain-tests>=1.1.9,<2", "langchain-community>=0.4,<1", "langchain-classic>=1.0.7,<2", "langchain>=1.4.7,<2", "pillow>=11,<14", "pymupdf>=1.26,<3", "build>=1.2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
