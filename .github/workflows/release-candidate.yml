name: Build release candidate (no publishing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Build wheels and source distributions without workspace sources
        run: |
          uv build --no-sources --package langchain-antfly
          uv build --no-sources --package langgraph-store-antfly
      - name: Validate package metadata and PyPI descriptions
        run: uvx 'twine>=7,<8' check --strict dist/*.whl dist/*.tar.gz
      - name: Record source and artifact checksums
        run: |
          git rev-parse HEAD > dist/SOURCE-COMMIT.txt
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
